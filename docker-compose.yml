# Local Postgres for development. RDS is private and only reachable from ECS.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kivugallery
      POSTGRES_USER: galleryadmin
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
