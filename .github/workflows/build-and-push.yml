name: build-and-push

on:
  # Every push, on every branch (and tag). Only main deploys.
  push:

# Required for OIDC federation with AWS (no long-lived credentials).
permissions:
  id-token: write
  contents: read

# One deploy at a time per ref, so two quick main pushes cannot interleave
# their deploy bundle uploads and "latest" pushes.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build-push-deploy:
    environment: dev
    needs: test
    runs-on: ubuntu-latest
    env:
      PROJECT: kivu-gallery
      ECR_REPO: kivu-gallery-app
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Set AWS_ROLE_ARN as a secret (on the dev environment or repository)
          # to the CI role created by the foundation stack
          # (output kivu-gallery-ci-role-arn).
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_URI="$REGISTRY/${ECR_REPO}"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          docker build -t "$IMAGE_URI:${{ github.sha }}" -t "$IMAGE_URI:latest" .

      - name: Push commit SHA tag
        run: |
          set -euo pipefail
          # SHA tags are immutable in ECR. On a re-run the tag already exists
          # (same commit, same image), so skip the push instead of failing.
          if docker manifest inspect "$IMAGE_URI:${{ github.sha }}" >/dev/null 2>&1; then
            echo "$IMAGE_URI:${{ github.sha }} already exists, skipping push."
          else
            docker push "$IMAGE_URI:${{ github.sha }}"
          fi

      - name: Generate and upload deploy bundle
        id: bundle
        if: env.IS_MAIN == 'true'
        run: |
          set -euo pipefail
          PREFIX="/${PROJECT}/deploy"

          # The deploy bundle needs values published by the infrastructure
          # stack. If they are not there yet, stop here: the SHA image is in
          # ECR, and without a bundle there is nothing for the pipeline to
          # deploy. Deploy the infrastructure stack, then re-run this workflow.
          if ! aws ssm get-parameter --name "$PREFIX/execution-role-arn" >/dev/null 2>&1; then
            echo "::warning::Infrastructure parameters not found under $PREFIX. Skipping deploy."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          get() { aws ssm get-parameter --name "$PREFIX/$1" --query 'Parameter.Value' --output text; }
          EXEC_ROLE_ARN=$(get execution-role-arn)
          TASK_ROLE_ARN=$(get task-role-arn)
          LOG_GROUP=$(get log-group)
          IMAGE_BUCKET=$(get image-bucket)
          CLOUDFRONT_DOMAIN=$(get cloudfront-domain)
          DB_HOST=$(get db-host)
          DB_NAME=$(get db-name)
          DB_USER=$(get db-user)
          DB_SECRET_ARN=$(get db-secret-arn)

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ARTIFACT_BUCKET="${PROJECT}-artifacts-${ACCOUNT_ID}-${AWS_REGION}"

          mkdir -p build
          # Fill every placeholder except <IMAGE1_NAME>, which the pipeline
          # replaces with the pushed image URI at deploy time.
          sed \
            -e "s|<EXECUTION_ROLE_ARN>|${EXEC_ROLE_ARN}|g" \
            -e "s|<TASK_ROLE_ARN>|${TASK_ROLE_ARN}|g" \
            -e "s|<LOG_GROUP>|${LOG_GROUP}|g" \
            -e "s|<AWS_REGION>|${AWS_REGION}|g" \
            -e "s|<IMAGE_BUCKET>|${IMAGE_BUCKET}|g" \
            -e "s|<CLOUDFRONT_DOMAIN>|${CLOUDFRONT_DOMAIN}|g" \
            -e "s|<DB_HOST>|${DB_HOST}|g" \
            -e "s|<DB_NAME>|${DB_NAME}|g" \
            -e "s|<DB_USER>|${DB_USER}|g" \
            -e "s|<DB_SECRET_ARN>|${DB_SECRET_ARN}|g" \
            deploy/taskdef.json > build/taskdef.json
          cp deploy/appspec.yaml build/appspec.yaml

          cd build
          zip -j config-source.zip taskdef.json appspec.yaml
          aws s3 cp config-source.zip "s3://${ARTIFACT_BUCKET}/config-source.zip"
          echo "Uploaded config-source.zip to ${ARTIFACT_BUCKET}"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Promote image to latest (starts the blue/green deploy)
        if: steps.bundle.outputs.uploaded == 'true'
        run: |
          set -euo pipefail
          # The pipeline's ECR source action watches "latest", so this push is
          # what deploys. It runs after the bundle upload so the pipeline never
          # starts ahead of config-source.zip. ECR keeps every tag immutable
          # except "latest" (foundation stack exclusion filter).
          docker push "$IMAGE_URI:latest"
